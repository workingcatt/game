  if (state === "pause") drawEnd("일시정지", touchMode ? "화면을 탭하면 계속 · 뒤로 = 타이틀" : "Esc 또는 Enter로 계속");
  if (state === "over") drawEnd("노트북을 덮었다.", "인내심이 바닥났다…");
  if (state === "stageclear") drawEnd("작업 진행률 100%", stage.def.boss.name + "가 드디어 일을 했다. 다음 스테이지로!", true);
  if (state === "clear" && stage.def.extra) drawEnd("순전파 완료 <EOS>", "모든 AI의 근원을 혼냈다. …그리고 내일 또 일을 맡겼다.");
  else if (state === "clear" && justUnlocked) drawEnd(singleStage ? "스테이지 클리어!" : "모든 업무 처리 완료", "어디선가 Attention이 느껴진다… EXTRA 스테이지 해금!");
  else if (state === "clear") drawEnd(singleStage ? "스테이지 클리어!" : "모든 업무 처리 완료",
    singleStage ? stage.def.boss.name + "가 드디어 일을 했다." : "…그런데 어디선가 Attention이 느껴진다. (타이틀의 EXTRA)");
  g.restore();
  drawHUD();
}

// ================= 루프 =================
let last = performance.now(), acc = 0;
let lastErr = null;
function loop(now) {
  requestAnimationFrame(loop);   // 오류가 나도 다음 프레임은 반드시 예약 (예전엔 오류 한 번에 게임이 통째로 멈췄음)
  acc += Math.min(100, now - last); last = now;
  let n = 0;
  try {
    updateTouchUI();
    while (acc >= 1000 / 60 && n < 4) { update(); acc -= 1000 / 60; n++; }
  } catch (e) { acc = 0; lastErr = { msg: String(e && e.stack || e).split("\n").slice(0, 2).join(" / "), t: 600 }; console.error(e); }
  try { draw(); } catch (e) { lastErr = { msg: String(e && e.stack || e).split("\n").slice(0, 2).join(" / "), t: 600 }; console.error(e); }
  if (lastErr && lastErr.t > 0) {   // 오류 내용을 화면 아래에 잠깐 표시 (제보용)
    lastErr.t--;
    g.setTransform(SC, 0, 0, SC, 0, 0); g.fillStyle = "rgba(120,0,0,.85)"; g.fillRect(0, LH - 18, LW, 18);
    g.fillStyle = "#fff"; g.font = "10px monospace"; g.textAlign = "left"; g.fillText("오류: " + lastErr.msg.slice(0, 110), 6, LH - 6);
  }
}
(document.fonts && document.fonts.load ? Promise.all([document.fonts.load("12px 'Noto Sans KR'"), document.fonts.load("12px 'Silkscreen'")]).catch(() => {}) : Promise.resolve())
  .then(() => { cv.focus(); requestAnimationFrame(loop); });
})();
</script>
